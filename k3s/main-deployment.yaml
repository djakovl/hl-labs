apiVersion: apps/v1
kind: Deployment
metadata:
  name: main
  namespace: dyakovli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main
  template:
    metadata:
      labels:
        app: main
    spec:
      imagePullSecrets:
        - name: gitea-secret
      hostAliases:
        - ip: "10.60.3.12"
          hostnames: ["hl14.zil"]
        - ip: "10.60.3.13"
          hostnames: ["hl15.zil"]
      containers:
        - name: main
          image: git.dyakov.space/dyakovli/hl-main:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          startupProbe:               # ← было съехавшее выравнивание
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
