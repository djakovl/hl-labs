apiVersion: apps/v1
kind: Deployment
metadata:
  name: additional
  namespace: dyakovli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: additional
  template:
    metadata:
      labels:
        app: additional
    spec:
      imagePullSecrets:
        - name: gitea-secret
      containers:
        - name: additional
          image: git.dyakov.space/djakovli/hl-additional:1.0
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "0.25"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "0.75G"
          envFrom:
            - secretRef:
                name: app-config
            - secretRef:
                name: db-secret
