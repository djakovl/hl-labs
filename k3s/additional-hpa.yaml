apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: additional-hpa
  namespace: dyakovli
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: additional
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
    scaleDown:
      stabilizationWindowSeconds: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
