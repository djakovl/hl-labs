spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

additional-service.url=http://${ADDITIONAL_URL}:${ADDITIONAL_PORT}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Параметры окон (секунды)
observability.window.short=10
observability.window.medium=30
observability.window.long=60
# Частота репорта (мс)
observability.schedule.ms=10000
logging.level.org.apache.tomcat=DEBUG


spring.kafka.bootstrap-servers=${KAFKA_URL}:${KAFKA_PORT}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-records=50

kafka.consumer.concurrency=${KAFKA_CONCURRENCY}
kafka.topic.name=${KAFKA_TOPIC}