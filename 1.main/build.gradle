plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'digital.zil.hl'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters']
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	implementation "org.flywaydb:flyway-database-postgresql"
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9"
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.kafka:spring-kafka'
	// implementation "org.springframework.boot:spring-boot-starter-actuator:4.0.6"
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.zonky.test:embedded-database-spring-test:2.7.1'
	testImplementation 'io.zonky.test:embedded-postgres:2.2.2'

	// КРИТИЧЕСКИ ВАЖНО: Стартер для поддержки @AutoConfigureMockMvc в Spring Boot 4
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// JUnit 5 (Jupiter) теперь является единственным поддерживаемым стандартом
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


}

tasks.named('test') {
	useJUnitPlatform()
}
