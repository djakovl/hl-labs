server.port=8081
spring.application.name=additional

# URL основного сервиса — переопределяется через env
main-service.url=${MAIN_SERVICE_URL:http://localhost:8080}

# Параметры окон (секунды)
observability.window.short=10
observability.window.medium=30
observability.window.long=60
observability.schedule.ms=10000
cache.stats.interval.ms=30000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

resilience4j.retry.instances.coreServiceRetry.maxAttempts=9
resilience4j.retry.instances.coreServiceRetry.waitDuration=6s
resilience4j.retry.instances.coreServiceRetry.retryExceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.coreServiceRetry.retryExceptions[1]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.coreServiceRetry.retryExceptions[2]=java.io.IOException
resilience4j.retry.instances.coreServiceRetry.ignoreExceptions[0]=org.springframework.web.client.HttpClientErrorException
n