server.port=8081
spring.application.name=additional

# URL основного сервиса — переопределяется через env
main-service.url=${MAIN_SERVICE_URL:http://localhost:8080}

# Параметры окон (секунды)
observability.window.short=10
observability.window.medium=30
observability.window.long=60
observability.schedule.ms=10000
cache.stats.interval.ms=30000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

resilience4j.circuitbreaker.instances.mainService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.mainService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mainService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mainService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mainService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.mainService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mainService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.mainService.record-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.mainService.record-exceptions[1]=org.springframework.web.client.HttpServerErrorException